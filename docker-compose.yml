services:
  postgres:
    image: postgres:11
    environment:
      - POSTGRES_DB=kvs
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=hunter2
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  kvs:
    build: kvs
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=kvs
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=hunter2
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata: {}
